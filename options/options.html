<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ampulheta · Sites e limites</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <img src="../icons/icon48.png" alt="" width="32" height="32">
      <div>
        <h1>Sites e limites</h1>
        <p class="muted">Tempo máximo por dia em cada site. Subdomínios entram na conta do site principal.</p>
      </div>
    </header>

    <section class="card">
      <h2>Adicionar site</h2>
      <form id="add-form" class="add-form" autocomplete="off">
        <label class="field grow">
          <span>Site</span>
          <input id="add-domain" type="text" placeholder="instagram.com" required>
        </label>
        <label class="field">
          <span>Minutos por dia</span>
          <input id="add-minutes" type="number" min="1" max="1440" step="1" value="30" required>
        </label>
        <button type="submit" class="primary">Adicionar</button>
      </form>
      <p id="add-error" class="error" role="alert" hidden></p>
    </section>

    <section class="card">
      <h2>Limites</h2>
      <ul id="limit-list" class="limit-list"></ul>
      <p id="no-limits" class="muted" hidden>Nenhum limite cadastrado.</p>
    </section>

    <section class="card">
      <h2>Dados</h2>
      <p class="muted">Tudo fica só neste navegador. O histórico com mais de 90 dias é apagado automaticamente.</p>
      <div class="data-actions">
        <button id="open-dashboard">Abrir resumo da semana</button>
        <button id="clear-history" class="danger-button">Apagar histórico</button>
      </div>
    </section>

    <p id="saved" class="saved" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
