<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Ampulheta</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="18" height="18">
      <span>Ampulheta</span>
    </div>
    <button id="open-options" class="icon-button" title="Sites e limites" aria-label="Sites e limites">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    </button>
  </header>

  <section class="current" aria-live="polite">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52"/>
        <circle class="ring-value" id="ring-value" cx="60" cy="60" r="52"/>
      </svg>
      <div class="ring-label">
        <strong id="ring-main" class="tabular">0 min</strong>
        <span id="ring-sub" class="muted">hoje</span>
      </div>
    </div>
    <p id="current-site" class="current-site"></p>
    <button id="set-limit" class="link-button" hidden>Definir limite</button>
  </section>

  <section class="today">
    <div class="section-head">
      <h2>Hoje</h2>
      <span id="today-total" class="muted tabular"></span>
    </div>
    <ul id="site-list" class="site-list"></ul>
    <p id="empty" class="muted empty" hidden>Nenhum site visitado ainda hoje.</p>
  </section>

  <footer class="bottom">
    <button id="open-dashboard" class="primary">Resumo da semana</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
